<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>Bismillah Mobile Shop</title>
  <meta name="theme-color" content="#0d6b4f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8f9fa;
      --text: #212529;
      --text2: #6c757d;
      --primary: #0d6b4f;
      --primary-light: #198754;
      --gold: #d4a745;
      --danger: #dc3545;
      --star: #ffc107;
      --border: #dee2e6;
      --shadow: 0 4px 12px rgba(0,0,0,0.1);
    }
    .dark {
      --bg: #1a1a2e;
      --surface: #16213e;
      --text: #e0e0e0;
      --text2: #aaaaaa;
      --primary: #0d6b4f;
      --primary-light: #198754;
      --border: #0f3460;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text); transition:0.3s; }
    .container { max-width:500px; margin:0 auto; padding:10px; }
    header { background:var(--surface); padding:12px; border-bottom:2px solid var(--primary); position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center; }
    .logo { font-size:1.4rem; font-weight:800; color:var(--primary); }
    .logo span { color:var(--gold); }
    .actions { display:flex; gap:12px; }
    .btn-icon { background:none; border:none; font-size:1.4rem; cursor:pointer; padding:6px; border-radius:50%; transition:0.2s; }
    .btn-icon:hover { background:var(--border); }
    .search-bar { margin:10px 0; }
    .search-bar input { width:100%; padding:10px 14px; border-radius:20px; border:2px solid var(--border); font-size:1rem; background:var(--surface); color:var(--text); }
    .categories { display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin:10px 0; }
    .cat-btn { white-space:nowrap; padding:8px 16px; border-radius:20px; background:var(--surface); border:1px solid var(--border); cursor:pointer; font-size:0.9rem; transition:0.2s; }
    .cat-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .product-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .product-card { background:var(--surface); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); transition:0.3s; }
    .product-card:hover { transform:translateY(-4px); }
    .product-img { height:160px; background:#e9ecef; display:flex; align-items:center; justify-content:center; font-size:3rem; }
    .product-info { padding:10px; }
    .product-name { font-weight:600; font-size:1rem; margin-bottom:4px; }
    .product-price { font-weight:700; color:var(--primary); font-size:1.1rem; }
    .product-old-price { text-decoration:line-through; color:var(--text2); font-size:0.85rem; margin-right:8px; }
    .add-cart-btn { width:100%; padding:8px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-weight:600; margin-top:8px; cursor:pointer; transition:0.2s; }
    .add-cart-btn:hover { background:var(--primary-light); }
    .cart-panel { position:fixed; bottom:-100%; left:0; right:0; background:var(--surface); border-radius:20px 20px 0 0; padding:16px; box-shadow:0 -4px 20px rgba(0,0,0,0.2); transition:bottom 0.3s; z-index:20; max-height:70vh; overflow-y:auto; }
    .cart-panel.open { bottom:0; }
    .cart-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
    .cart-item-name { font-weight:600; }
    .cart-qty { display:flex; gap:8px; align-items:center; }
    .cart-qty button { width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:var(--surface); font-size:1.2rem; cursor:pointer; }
    .checkout-btn { background:var(--gold); color:#000; width:100%; padding:14px; border-radius:12px; font-weight:800; font-size:1.1rem; border:none; margin-top:12px; cursor:pointer; }
    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 24px; border-radius:20px; z-index:100; opacity:0; transition:0.3s; }
    .toast.show { opacity:1; }
    .theme-toggle { cursor:pointer; }
    @media (max-width:350px) { .product-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Bismillah <span>Mobile Shop</span></div>
      <div class="actions">
        <button class="btn-icon theme-toggle" onclick="toggleTheme()">🌙</button>
        <button class="btn-icon" onclick="toggleCart()">🛒<span id="cartCount" style="font-size:0.75rem; vertical-align:top; background:var(--danger); color:#fff; border-radius:50%; padding:2px 5px;">0</span></button>
      </div>
    </header>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="موبائل تلاش کریں...">
    </div>
    <div class="categories" id="categoryBtns">
      <button class="cat-btn active" data-cat="all">تمام</button>
      <button class="cat-btn" data-cat="Smartphone">اسمارٹ فون</button>
      <button class="cat-btn" data-cat="Feature Phone">فیچر فون</button>
      <button class="cat-btn" data-cat="Accessories">لوازمات</button>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <div class="cart-panel" id="cartPanel">
    <h3 style="margin-bottom:12px; display:flex; justify-content:space-between;">
      <span>🛒 آپ کی ٹوکری</span>
      <button class="btn-icon" onclick="toggleCart()">✕</button>
    </h3>
    <div id="cartItems"></div>
    <div style="font-weight:700; margin:12px 0; text-align:right;">کل رقم: <span id="cartTotal">0</span> روپے</div>
    <button class="checkout-btn" onclick="checkoutWhatsApp()">⚡ WhatsApp پر آرڈر کریں</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ====== اپنی مصنوعات یہاں تبدیل کریں ======
    const products = [
      { id:1, name:'Samsung Galaxy A14', category:'Smartphone', price:42000, oldPrice:45000, img:'📱', desc:'4GB RAM, 64GB Storage' },
      { id:2, name:'iPhone 13 Pro', category:'Smartphone', price:185000, oldPrice:195000, img:'📱', desc:'128GB, PTA Approved' },
      { id:3, name:'Nokia 105', category:'Feature Phone', price:2450, oldPrice:2600, img:'📞', desc:'Dual SIM, FM Radio' },
      { id:4, name:'Bluetooth Earphones', category:'Accessories', price:1200, oldPrice:1500, img:'🎧', desc:'Wireless, 5hrs battery' },
      { id:5, name:'Mobile Cover Designer', category:'Accessories', price:500, oldPrice:650, img:'🛡️', desc:'Shockproof, all models' },
      { id:6, name:'Charger 33W Fast', category:'Accessories', price:1800, oldPrice:2200, img:'🔌', desc:'USB-C, compatible' },
      { id:7, name:'Infinix Hot 30i', category:'Smartphone', price:28500, oldPrice:30000, img:'📱', desc:'4+128GB, 5000mAh' },
      { id:8, name:'Memory Card 64GB', category:'Accessories', price:1500, oldPrice:1800, img:'💾', desc:'Class 10, UHS-1' },
    ];

    // ====== اپنا واٹس ایپ نمبر یہاں ڈالیں (کنٹری کوڈ کے ساتھ) ======
    const phone = '923001234567'; // ← یہ نمبر بدل دیں

    let cart = JSON.parse(localStorage.getItem('bms_cart')) || [];
    let activeCategory = 'all';

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => {
        const catMatch = activeCategory === 'all' || p.category === activeCategory;
        const nameMatch = p.name.toLowerCase().includes(searchTerm) || p.category.toLowerCase().includes(searchTerm);
        return catMatch && nameMatch;
      });
      grid.innerHTML = filtered.map(p => `
        <div class="product-card">
          <div class="product-img">${p.img}</div>
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-price">
              ${p.oldPrice ? `<span class="product-old-price">Rs.${p.oldPrice}</span>` : ''}
              Rs.${p.price}
            </div>
            <button class="add-cart-btn" onclick="addToCart(${p.id})">ٹوکری میں ڈالیں</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const existing = cart.find(i => i.id === id);
      if (existing) existing.qty++;
      else cart.push({...product, qty:1});
      saveCart(); updateCartBadge();
      showToast('✅ پروڈکٹ شامل کر لی گئی');
    }

    function removeFromCart(id) { cart = cart.filter(i => i.id !== id); saveCart(); renderCart(); }
    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) { removeFromCart(id); return; }
      saveCart(); renderCart();
    }

    function saveCart() { localStorage.setItem('bms_cart', JSON.stringify(cart)); updateCartBadge(); }
    function updateCartBadge() {
      const count = cart.reduce((sum, i) => sum + i.qty, 0);
      document.getElementById('cartCount').textContent = count;
    }

    function renderCart() {
      const container = document.getElementById('cartItems');
      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:var(--text2);">🛒 ٹوکری خالی ہے</p>';
        document.getElementById('cartTotal').textContent = '0';
        return;
      }
      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <div class="cart-item-name">${item.name}</div>
            <small>Rs.${item.price} × ${item.qty} = Rs.${item.price * item.qty}</small>
          </div>
          <div class="cart-qty">
            <button onclick="changeQty(${item.id}, -1)">-</button>
            <span>${item.qty}</span>
            <button onclick="changeQty(${item.id}, 1)">+</button>
            <button style="color:red; background:none; border:none; margin-right:8px;" onclick="removeFromCart(${item.id})">🗑️</button>
          </div>
        </div>
      `).join('');
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      document.getElementById('cartTotal').textContent = total.toLocaleString();
    }

    function toggleCart() {
      document.getElementById('cartPanel').classList.toggle('open');
      renderCart();
    }

    function checkoutWhatsApp() {
      if (cart.length === 0) { showToast('⚠️ پہلے کچھ پروڈکٹ شامل کریں'); return; }
      const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
      let message = '*Bismillah Mobile Shop* سے نیا آرڈر:%0A';
      cart.forEach(item => {
        message += `• ${item.name} (x${item.qty}) - Rs.${item.price * item.qty}%0A`;
      });
      message += `%0A*کل رقم: Rs.${total}*%0Aبراہ کرم تصدیق کر دیں۔`;
      window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      document.querySelector('.theme-toggle').textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('bms_theme', isDark ? 'dark' : 'light');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    document.getElementById('searchInput').addEventListener('input', renderProducts);
    document.getElementById('categoryBtns').addEventListener('click', (e) => {
      if (e.target.classList.contains('cat-btn')) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeCategory = e.target.dataset.cat;
        renderProducts();
      }
    });

    // انسٹالیشن کے لیے manifest خودکار بنائیں
    (function() {
      const manifest = {
        name: 'Bismillah Mobile Shop',
        short_name: 'BMS',
        start_url: '.',
        display: 'standalone',
        background_color: '#ffffff',
        theme_color: '#0d6b4f'
      };
      const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
      const manifestURL = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestURL;
      document.head.appendChild(link);

      const savedTheme = localStorage.getItem('bms_theme');
      if (savedTheme === 'dark') { document.body.classList.add('dark'); document.querySelector('.theme-toggle').textContent = '☀️'; }
      renderProducts();
      updateCartBadge();
    })();
  </script>
</body>
</html>
